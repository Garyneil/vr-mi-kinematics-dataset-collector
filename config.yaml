runtime:
  serial:
    port: "/dev/ttyTHS0"
    baudrate: 115200
    timeout_sec: 1.0
    frame_mode: "legacy26"   # legacy26 或 counter30
    header: 255
    tail: 254
    sampling_rate_hz: 250.0
    eeg_channels: 8
    ecg_channels: 4
    eeg_scale: 1.0
    ecg_scale: 1.0
  output_dir: "data/raw"
  random_seed: 42

hardware:
  eeg_channel_names:
    - "EEG1"
    - "EEG2"
    - "EEG3"
    - "EEG4"
    - "EEG5"
    - "EEG6"
    - "EEG7"
    - "EEG8"
  ecg_channel_names:
    - "ECG1"
    - "ECG2"
    - "ECG3"
    - "ECG4"
  reference: "TBD"
  ground: "TBD"
  physical_units: "raw_adc"

mocap:
  enabled: false
  adapter: "none"            # none 或 generic_udp，后续可扩展厂商 SDK
  host: "0.0.0.0"
  port: 7001
  sampling_rate_hz: null      # 设备确认后填写
  coordinate_system: "TBD"
  position_unit: "TBD"
  orientation_format: "TBD"
  node_names: []              # 设备确认后填写，例如 shoulder/elbow/wrist/hand
  record_during_motor_imagery: true
  use_for_movement_contamination_screening: true

vr:
  enabled: false
  engine: "TBD"              # Unity / Unreal / other
  event_transport: "udp"
  host: "127.0.0.1"
  port: 7002
  headset_model: "TBD"
  controller_tracking: false

synchronization:
  master_clock: "host_monotonic"
  save_host_timestamp: true
  save_device_packet_id: true
  save_device_timestamp: false
  vr_event_timestamp_source: "host_receive_time"
  mocap_timestamp_source: "TBD"

protocol:
  tasks:
    - "grasp"
    - "handover"
    - "place"
    - "press"
  blocks: 6
  trials_per_task_per_block: 10
  baseline_duration_sec: 30.0
  fixation_duration_sec: 2.0
  cue_duration_sec: 1.0
  execution_duration_sec: 4.0
  imagery_duration_sec: 4.0
  feedback_duration_sec: 1.5
  iti_min_sec: 2.0
  iti_max_sec: 3.5
  max_same_task_in_row: 2
  block_break_sec: 180.0

stages:
  overt_execution:
    record_kinematics: true
    enable_feedback: false
  motor_imagery:
    record_kinematics: true    # 仅用于静止检测，不作为模型输入
    enable_feedback: false
  closed_loop:
    record_kinematics: false
    enable_feedback: true

quality_control:
  expected_sampling_tolerance: 0.08
  reject_on_packet_loss: false
  maximum_packet_loss_ratio: 0.01
  movement_screening:
    enabled: false
    hand_displacement_threshold_m: null
    wrist_velocity_threshold_mps: null
